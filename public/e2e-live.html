<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Live E2E fixture</title>
  </head>
  <body>
    <div id="live-status">idle</div>
    <div id="live-count">0</div>
    <script type="module">
      import { LivePage } from "/src/live/livePage.ts";

      const params = new URLSearchParams(location.search);
      const sessionId = params.get("id") ?? "demo-session";
      const page = new LivePage({
        sessionId,
        statusEl: document.getElementById("live-status"),
        countEl: document.getElementById("live-count"),
      });
      page.connect();
    </script>
  </body>
</html>
