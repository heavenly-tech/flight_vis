<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="3D flight visualization for IGC and GPX tracks." />
    <title>flight_vis</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Outfit:wght@380;500;650&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="cesiumContainer"></div>
    <div id="credits"></div>

    <div id="ui">
      <header class="topbar">
        <div>
          <p class="brand">flight_vis</p>
          <p id="flight-name" class="flight-name">Loading Vuelo5…</p>
        </div>
        <div class="top-actions">
          <label class="file-btn">
            Open track
            <input id="file-input" type="file" accept=".gpx,.igc,.GPX,.IGC" />
          </label>
          <div class="modes" role="group" aria-label="Color mode">
            <button type="button" data-mode="altitude" class="chip active">Alt</button>
            <button type="button" data-mode="speed" class="chip">Speed</button>
            <button type="button" data-mode="vario" class="chip">Vario</button>
          </div>
        </div>
      </header>

      <aside id="hud" class="hud" hidden>
        <div><span>ALT</span><strong id="stat-alt">—</strong></div>
        <div><span>SPD</span><strong id="stat-spd">—</strong></div>
        <div><span>VARIO</span><strong id="stat-vario">—</strong></div>
        <div><span>DIST</span><strong id="stat-dist">—</strong></div>
        <div><span>TIME</span><strong id="stat-time">—</strong></div>
        <div><span>UTC</span><strong id="stat-utc">—</strong></div>
      </aside>

      <p id="status" class="status">Preparing 3D globe…</p>

      <footer class="transport">
        <div class="transport-row">
          <button type="button" id="btn-play" class="play">Play</button>
          <button type="button" id="btn-follow" class="chip" aria-pressed="true">Follow</button>
          <button type="button" id="btn-overview" class="chip">Overview</button>
          <label class="speed">
            <span>Speed</span>
            <select id="play-speed">
              <option value="1">1×</option>
              <option value="5">5×</option>
              <option value="10">10×</option>
              <option value="20" selected>20×</option>
              <option value="50">50×</option>
              <option value="100">100×</option>
            </select>
          </label>
          <p id="summary" class="summary"></p>
        </div>
        <canvas id="profile" height="88" aria-label="Altitude profile"></canvas>
      </footer>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
