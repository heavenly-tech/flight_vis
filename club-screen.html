<!doctype html>
<html lang="es-CL">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title data-i18n="kiosk.screenTitle">Pantalla de check-in</title>
    <link rel="stylesheet" href="/src/style.css" />
    <style>
      html, body { margin: 0; height: 100%; background: #0b0f14; color: #e8ecf1; }
      .kiosk-viewport {
        position: relative;
        display: flex;
        flex-direction: column;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        background: linear-gradient(180deg, #0b0f14 0%, #121922 100%);
      }
      .kiosk-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        padding: 1.25rem 2rem 0.75rem;
        flex: 0 0 auto;
        z-index: 6;
      }
      .kiosk-header-main {
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        gap: 0.4rem 1.25rem;
        min-width: 0;
      }
      .kiosk-header-main h2 { margin: 0; font-size: 1.15rem; font-weight: 600; }
      #status-bar {
        margin: 0;
        font-size: 0.85rem;
        opacity: 0.75;
      }
      #toolbar-local {
        display: flex;
        flex: 0 0 auto;
        gap: 0.5rem;
      }
      #toolbar-local button { font: inherit; padding: 0.35rem 0.65rem; }
      #map-layer {
        flex: 1 1 auto;
        min-height: 0;
        overflow: auto;
        padding: 0.75rem 2rem 2rem;
        box-sizing: border-box;
        opacity: 0.92;
      }
      #map-layer ul { list-style: none; margin: 0; padding: 0; columns: 2; gap: 1rem; }
      #map-layer li { padding: 0.35rem 0; font-size: 1.05rem; }
      #map-layer.map-expanded { padding: 1rem 2.5rem 2.5rem; }
      #map-layer.map-expanded ul { columns: 3; font-size: 1.2rem; }
      #activate {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(0, 0, 0, 0.75);
        z-index: 10;
      }
      #activate[hidden] { display: none; }
      #activate-inner { max-width: 28rem; width: 100%; padding: 1.5rem; box-sizing: border-box; }
      .activate-label { display: block; margin-bottom: 0.75rem; opacity: 0.85; }
      .activate-row { display: flex; gap: 0.5rem; flex-wrap: wrap; }
      #activate-token { flex: 1; min-width: 12rem; font: inherit; }
      #qr-wrap {
        position: absolute;
        z-index: 5;
        box-sizing: border-box;
        background: #fff;
        padding: 12px;
        border-radius: 12px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.45);
      }
      #qr-wrap img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: contain;
        filter: contrast(1.25);
      }
    </style>
  </head>
  <body>
    <div class="kiosk-viewport" id="viewport">
      <header class="kiosk-header">
        <div class="kiosk-header-main">
          <h2 data-i18n="kiosk.liveAircraft">Aeronaves en vivo</h2>
          <p id="status-bar" role="status" aria-live="polite" data-i18n="kiosk.starting">Iniciando pantalla…</p>
        </div>
        <div id="toolbar-local">
          <button type="button" id="btn-local-qr" data-i18n="kiosk.qrHide" hidden>Ocultar QR</button>
        </div>
      </header>
      <section id="map-layer" data-i18n-aria="kiosk.liveMapAria" aria-label="Mapa en vivo del club">
        <ul id="map"></ul>
      </section>
      <div id="qr-wrap" hidden>
        <img id="qr" data-i18n-alt="kiosk.qrAlt" alt="QR de check-in" width="256" height="256" />
      </div>
      <div id="activate" hidden>
        <form id="activate-inner">
          <label for="activate-token" class="activate-label" data-i18n="kiosk.pasteToken">Pega el token de activación de pantalla desde el mapa admin.</label>
          <div class="activate-row">
            <input id="activate-token" name="token" type="password" autocomplete="off" required />
            <button type="submit" id="btn-activate" data-i18n="kiosk.activate">Activar pantalla</button>
          </div>
        </form>
      </div>
    </div>
    <script type="module" src="/src/club/clubScreen.ts"></script>
  </body>
</html>
