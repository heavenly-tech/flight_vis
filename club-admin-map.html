<!doctype html>
<html lang="es-CL">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title data-i18n="admin.liveMapTitle">flight_vis</title>
    <link rel="stylesheet" href="/src/style.css" />
    <style>
      main { max-width: 44rem; margin: 1rem auto; padding: 0 1rem 2rem; }
      .admin-nav { display: flex; flex-wrap: wrap; gap: .5rem; margin: .75rem 0 1.25rem; font-size: .9rem; }
      #ticks label { display: inline-block; margin: 0 .65rem .35rem 0; }
      button, select { font: inherit; padding: .45rem .7rem; }
      #lang-slot { margin: .5rem 0; font-size: .9rem; }
      #club-locale { margin: 1rem 0; padding: .75rem; border: 1px solid rgba(255,255,255,.12); border-radius: 8px; }
    </style>
  </head>
  <body>
    <main>
      <div id="lang-slot"></div>
      <h1 data-i18n="admin.liveMapTitle"></h1>
      <p class="muted" data-i18n="admin.tailFilterHint"></p>
      <div id="admin-nav"></div>
      <section id="club-locale">
        <label>
          <span data-i18n="admin.clubDefaultLanguage"></span>
          <select id="club-locale-select"></select>
        </label>
        <p class="muted" data-i18n="admin.clubDefaultLanguageHelp"></p>
        <button type="button" id="club-locale-save" data-i18n="common.save"></button>
        <p id="club-locale-msg" class="muted"></p>
      </section>
      <section id="club-slug">
        <label>
          <span data-i18n="admin.clubSlug"></span>
          <input id="club-slug-input" type="text" maxlength="48" spellcheck="false" pattern="[a-z0-9-]+" />
        </label>
        <p class="muted" data-i18n="admin.clubSlugHelp"></p>
        <button type="button" id="club-slug-save" data-i18n="admin.clubSlugSave"></button>
        <p id="club-slug-msg" class="muted"></p>
      </section>
      <section id="club-base">
        <h2 style="font-size:1rem" data-i18n="admin.aerodromeBase"></h2>
        <label>
          <span data-i18n="admin.icaoCode"></span>
          <input id="club-base-icao-input" type="text" maxlength="4" spellcheck="false" style="text-transform:uppercase" />
        </label>
        <label>
          <span data-i18n="admin.latitude"></span>
          <input id="club-base-lat-input" type="number" step="0.0001" min="-90" max="90" />
        </label>
        <label>
          <span data-i18n="admin.longitude"></span>
          <input id="club-base-lon-input" type="number" step="0.0001" min="-180" max="180" />
        </label>
        <button type="button" id="club-base-save" data-i18n="admin.saveBase"></button>
        <p id="club-base-msg" class="muted"></p>
      </section>
      <section>
        <h2 style="font-size:1rem" data-i18n="admin.showTails"></h2>
        <div id="ticks"></div>
        <button type="button" id="save" data-i18n="admin.saveSelection"></button>
        <button type="button" id="btn-kiosk" data-i18n="admin.kioskSession"></button>
        <p id="kiosk-url" class="muted"></p>
      </section>
      <section>
        <h2 style="font-size:1rem" data-i18n="admin.liveAircraft"></h2>
        <ul id="live"></ul>
      </section>
    </main>
    <script type="module" src="/src/club/adminMap.ts"></script>
  </body>
</html>
