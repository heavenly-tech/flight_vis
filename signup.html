<!doctype html>
<html lang="es-CL">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title data-i18n="account.signup.title">flight_vis</title>
    <link rel="stylesheet" href="/src/style.css" />
    <style>main{max-width:24rem;margin:3rem auto;padding:1rem} input,button{width:100%;padding:.6rem;margin:.35rem 0;font:inherit} #lang-slot{margin-bottom:.75rem;font-size:.9rem}</style>
  </head>
  <body>
    <main>
      <div id="lang-slot"></div>
      <h1 data-i18n="account.signup.title">Crea tu cuenta</h1>
      <p class="muted" data-i18n="account.signup.lead">Una cuenta personal; después únete a clubs.</p>
      <form id="form">
        <input name="email" type="email" required data-i18n-placeholder="account.signup.email" />
        <input name="password" type="password" data-i18n-placeholder="account.signup.password" minlength="8" />
        <button type="submit" data-i18n="account.signup.submit"></button>
      </form>
      <p id="msg" class="muted"></p>
      <p class="muted"><a href="/club-login.html" data-i18n="account.signup.haveAccount"></a></p>
    </main>
    <script type="module" src="/src/club/accountSignup.ts"></script>
  </body>
</html>
