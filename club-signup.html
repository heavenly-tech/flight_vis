<!doctype html>
<html lang="es-CL">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title data-i18n="club.signup.title">flight_vis</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body class="fv-auth-page">
    <main class="auth-card">
      <div id="lang-slot" class="lang-bar"></div>
      <h1 data-i18n="club.signup.title"></h1>
      <p class="muted" data-i18n="club.signup.lead"></p>
      <form id="form" method="post" action="/api/clubs/signup">
        <div class="field">
          <label for="club-name" data-i18n="club.signup.clubName"></label>
          <input id="club-name" name="name" required data-i18n-placeholder="club.signup.clubName" autocomplete="organization" />
        </div>
        <div class="field">
          <label for="club-slug" data-i18n="club.signup.slug"></label>
          <input id="club-slug" name="slug" required pattern="[a-z0-9-]{2,48}" data-i18n-placeholder="club.signup.slug" autocomplete="off" />
        </div>
        <div class="field">
          <label for="club-email" data-i18n="club.signup.contactEmail"></label>
          <input id="club-email" name="email" type="email" required data-i18n-placeholder="club.signup.contactEmail" autocomplete="email" />
        </div>
        <div class="field">
          <label for="club-icao" data-i18n="club.signup.icaoOptional"></label>
          <input id="club-icao" name="aerodrome_icao" maxlength="4" pattern="[A-Za-z]{4}" data-i18n-placeholder="club.signup.icaoOptional" autocomplete="off" />
        </div>
        <input class="hp" name="website" tabindex="-1" autocomplete="off" aria-hidden="true" />
        <button type="submit" class="btn-primary" data-i18n="club.signup.submit"></button>
      </form>
      <p id="msg" class="status-msg" role="status" aria-live="polite"></p>
      <p class="muted"><a href="/login" data-i18n="nav.login">Iniciar sesión</a></p>
    </main>
    <script type="module" src="/src/club/clubSignupPage.ts"></script>
  </body>
</html>
