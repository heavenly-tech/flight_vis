<!doctype html>
<html lang="es-CL">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title data-i18n="nav.pilots">Pilotos</title>
    <link rel="stylesheet" href="/src/style.css" />
    <style>
      #invite-form { display: flex; flex-wrap: wrap; gap: .5rem; margin: .75rem 0 1rem; align-items: flex-end; }
      #invite-form .field { flex: 1 1 14rem; margin: 0; }
      .mem-row { margin: .5rem 0; padding: .65rem 0; border-bottom: 1px solid var(--stroke, rgba(255, 255, 255, 0.12)); }
      .mem-row .badge { font-size: .85rem; opacity: .85; margin-left: .35rem; }
      .mem-actions { margin-top: .45rem; display: flex; flex-wrap: wrap; gap: .4rem; }
      #invite-status { font-size: .9rem; min-height: 1.2rem; }
    </style>
  </head>
  <body class="fv-page admin-page">
    <main class="admin-shell" data-page="admin-pilots">
      <div id="lang-slot" class="lang-bar"></div>
      <h1 data-i18n="nav.pilots">Pilotos</h1>
      <div id="admin-nav"></div>
      <section id="invite-section">
        <h2 style="font-size:1rem" data-i18n="club.admin.addAdmin">Agregar administrador</h2>
        <p style="font-size:.9rem;margin:.25rem 0 .5rem" data-i18n="club.admin.inviteSendLead">
          Envía un correo de invitación para sumar otro administrador al club.
        </p>
        <form id="invite-form" method="post" action="/api/admin/memberships/invite">
          <div class="field">
            <label for="invite-email" data-i18n="club.login.email">Correo</label>
            <input id="invite-email" type="email" required autocomplete="email" data-i18n-placeholder="club.login.email" />
          </div>
          <button type="submit" class="btn-primary" data-i18n="club.admin.addAdmin">Agregar administrador</button>
        </form>
        <p id="invite-status" role="status" aria-live="polite"></p>
      </section>
      <h2 style="font-size:1rem" data-i18n="club.admin.pendingHeading">Pilotos pendientes</h2>
      <ul id="pending"></ul>
      <h2 style="font-size:1rem" data-i18n="club.admin.membershipsHeading">Membresías</h2>
      <p id="memberships-status" role="status" aria-live="polite" hidden></p>
      <div id="memberships"></div>
    </main>
    <dialog id="remove-dialog" aria-labelledby="remove-dialog-title">
      <h2 id="remove-dialog-title" data-i18n="club.admin.removeConfirmTitle">Quitar acceso</h2>
      <p id="remove-dialog-body"></p>
      <div class="dialog-actions">
        <button type="button" id="remove-cancel" class="chip" data-i18n="common.cancel">Cancelar</button>
        <button type="button" id="remove-confirm" class="chip danger" data-i18n="club.admin.remove">Quitar acceso</button>
      </div>
    </dialog>
    <script type="module" src="/src/club/adminPilots.ts"></script>
  </body>
</html>
