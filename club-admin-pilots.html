<!doctype html>
<html lang="es-CL">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title data-i18n="nav.pilots">flight_vis</title>
    <link rel="stylesheet" href="/src/style.css" />
    <style>
      main { max-width: 44rem; margin: 1rem auto; padding: 0 1rem 2rem; }
      .admin-nav { display: flex; flex-wrap: wrap; gap: .5rem; margin: .75rem 0 1.25rem; font-size: .9rem; }
      button { font: inherit; padding: .3rem .5rem; }
    </style>
  </head>
  <body>
    <main>
      <h1 data-i18n="nav.pilots">Pilotos</h1>
      <div id="lang-slot"></div>
      <div id="admin-nav"></div>
      <form id="add-form" style="display:flex;flex-wrap:wrap;gap:.5rem;margin:1rem 0">
        <input name="name" placeholder="Nombre" required />
        <input name="email" type="email" placeholder="Correo" required />
        <input name="license_no" placeholder="Licencia" />
        <select name="status">
          <option value="approved">approved</option>
          <option value="pending">pending</option>
        </select>
        <button type="submit" data-i18n="common.save">Guardar</button>
      </form>
      <h2 style="font-size:1rem">Pending approval</h2>
      <ul id="pending"></ul>
      <h2 style="font-size:1rem">All pilots</h2>
      <ul id="all"></ul>
    </main>
    <script type="module" src="/src/club/adminPilots.ts"></script>
  </body>
</html>
