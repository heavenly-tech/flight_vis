<!doctype html>
<html lang="es-CL">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title data-i18n="club.login.title">flight_vis</title>
    <link rel="stylesheet" href="/src/style.css" />
    <style>main{max-width:28rem;margin:3rem auto;padding:1rem} input,button{width:100%;padding:.6rem;margin:.35rem 0;font:inherit} #lang-slot{margin-bottom:.75rem;font-size:.9rem} ul{list-style:none;padding:0} li button{margin:.25rem 0}</style>
  </head>
  <body>
    <main>
      <div id="lang-slot"></div>
      <p class="muted"><a href="/login" id="back-chooser" data-i18n="entrar.back"></a></p>
      <section id="slug-panel" hidden>
        <h1 data-i18n="club.login.clubTitle">Inicio de sesión del club</h1>
        <p class="muted" data-i18n="club.login.clubLead"></p>
        <label data-i18n="club.register.pickClubLabel"></label>
        <input id="club-slug" name="club" type="text" required autocomplete="organization" data-i18n-placeholder="account.join.slug" />
        <button type="button" id="slug-continue" data-i18n="club.login.continue"></button>
      </section>
      <section id="login-panel">
        <h1 id="login-heading" data-i18n="club.login.title">Inicio de sesión</h1>
        <p id="club-slug-label" class="muted" hidden></p>
        <form id="form" method="post" action="/api/account/login">
          <input type="hidden" name="next" id="next" value="/club-pilot.html" />
          <input name="email" type="email" required data-i18n-placeholder="club.login.email" />
          <input name="password" type="password" data-i18n-placeholder="club.login.password" minlength="8" />
          <button type="submit" data-i18n="club.login.submit"></button>
          <button type="button" id="magic-btn" class="muted" data-i18n="club.login.sendMagic"></button>
        </form>
        <p id="msg" class="muted"></p>
        <p id="pilot-signup" class="muted"><a href="/signup.html" data-i18n="account.signup.link"></a></p>
        <details class="muted">
          <summary data-i18n="club.login.legacyApk"></summary>
          <form id="legacy-login" method="post" action="/api/club/login">
            <input type="hidden" name="next" id="legacy-next" value="/club-pilot.html" />
            <input name="email" type="email" required data-i18n-placeholder="club.login.email" />
            <input name="password" type="password" required minlength="8" />
            <button type="submit" data-i18n="club.login.legacySubmit"></button>
          </form>
        </details>
      </section>
      <section id="pick-panel" hidden>
        <h1 data-i18n="club.login.misClubs">Mis clubs</h1>
        <ul id="club-list"></ul>
        <button type="button" id="join-open" data-i18n="account.join.open"></button>
      </section>
      <section id="join-panel" hidden>
        <h1 data-i18n="account.join.title"></h1>
        <form id="join-form" method="post" action="/api/account/join">
          <input name="slug" required data-i18n-placeholder="account.join.slug" />
          <input name="name" data-i18n-placeholder="account.join.name" />
          <button type="submit" data-i18n="account.join.submit"></button>
        </form>
        <p id="join-msg" class="muted"></p>
      </section>
      <p class="muted"><a href="/club-register.html" data-i18n="nav.register"></a> · <a href="/club-signup.html" data-i18n="nav.createClub"></a></p>
    </main>
    <script type="module" src="/src/club/clubLoginAccountPage.ts"></script>
  </body>
</html>
