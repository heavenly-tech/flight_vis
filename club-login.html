<!doctype html>
<html lang="es-CL">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title data-i18n="club.login.title">flight_vis</title>
    <link rel="stylesheet" href="/src/style.css" />
    <style>main{max-width:24rem;margin:3rem auto;padding:1rem} input,button{width:100%;padding:.6rem;margin:.35rem 0;font:inherit} #lang-slot{margin-bottom:.75rem;font-size:.9rem}</style>
  </head>
  <body>
    <main>
      <div id="lang-slot"></div>
      <h1 data-i18n="club.login.title"></h1>
      <form id="form">
        <input name="email" type="email" required data-i18n-placeholder="club.login.email" />
        <input name="password" type="password" required data-i18n-placeholder="club.login.password" minlength="8" />
        <button type="submit" data-i18n="club.login.submit"></button>
      </form>
      <p id="msg" class="muted"></p>
      <p class="muted"><a href="/club-register.html" data-i18n="nav.register"></a> · <a href="/club-pilot.html" data-i18n="nav.pilotProfile"></a> · <a href="/app.html" data-i18n="nav.androidApp"></a></p>
    </main>
    <script type="module">
      import { startClubPage } from "/src/club/i18nPage.ts";
      import { t, apiErrorMessage } from "/src/i18n/boot.ts";
      await startClubPage({ persistUser: false });
      const form = document.getElementById("form");
      const msg = document.getElementById("msg");
      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        const body = Object.fromEntries(new FormData(form));
        const res = await fetch("/api/club/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          credentials: "same-origin",
          body: JSON.stringify(body),
        });
        if (res.ok) {
          msg.textContent = t("club.login.success");
          location.href = "/club-pilot.html";
        } else {
          const err = (await res.json().catch(() => ({}))).error ?? "unauthorized";
          msg.textContent = apiErrorMessage(String(err));
        }
      });
    </script>
  </body>
</html>
