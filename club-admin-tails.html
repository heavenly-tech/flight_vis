<!doctype html>
<html lang="es-CL">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title data-i18n="nav.tails">Matrículas</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body class="fv-page admin-page">
    <main class="admin-shell" data-page="admin-tails">
      <div id="lang-slot" class="lang-bar"></div>
      <h1 data-i18n="nav.tails">Matrículas</h1>
      <div id="admin-nav"></div>
      <form id="form" class="admin-form-row">
        <div class="field">
          <label for="tail-input" data-i18n="admin.tails.tailLabel">Matrícula</label>
          <input
            id="tail-input"
            name="tail"
            data-i18n-placeholder="admin.tails.tailPlaceholder"
            placeholder="ej. CC-ABC"
            required
          />
        </div>
        <div class="field">
          <label for="type-input" data-i18n="admin.tails.typeLabel">Tipo de aeronave</label>
          <select id="type-input" name="type" required></select>
        </div>
        <button type="submit" class="btn-primary" data-i18n="admin.tails.save">Guardar matrícula</button>
      </form>
      <p id="tails-no-types-hint" class="muted" hidden></p>
      <p id="tails-status" role="status" aria-live="polite" hidden></p>
      <ul id="list" class="admin-list"></ul>
    </main>
    <script type="module" src="/src/club/adminTails.ts"></script>
  </body>
</html>
