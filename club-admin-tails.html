<!doctype html>
<html lang="es-CL">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title data-i18n="nav.tails">flight_vis</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body class="fv-page">
    <main class="admin-shell">
      <div id="lang-slot" class="lang-bar"></div>
      <h1 data-i18n="nav.tails">Matrículas</h1>
      <div id="admin-nav"></div>
      <form id="form" class="admin-form-row">
        <div class="field">
          <label for="tail-code" data-i18n="admin.tailLabel">Matrícula</label>
          <input id="tail-code" name="tail" placeholder="CC-ABC" required />
        </div>
        <div class="field">
          <label for="tail-type" data-i18n="admin.aircraftTypeLabel">Tipo de aeronave</label>
          <input id="tail-type" name="type" placeholder="C152" required />
        </div>
        <button type="submit" class="btn-primary" data-i18n="common.save">Guardar</button>
      </form>
      <ul id="list"></ul>
    </main>
    <script type="module" src="/src/club/adminTails.ts"></script>
  </body>
</html>
