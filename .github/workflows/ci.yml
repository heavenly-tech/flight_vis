name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: flight_vis_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/flight_vis_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rust
        uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: clippy, rustfmt

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: native deps
        run: sudo apt-get update && sudo apt-get install -y ffmpeg libssl-dev pkg-config postgresql-client

      - name: e2e database seed note
        run: node scripts/e2e-seed.mjs

      - name: Postgres flightvis owner migration smoke
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -v ON_ERROR_STOP=1 <<'SQL'
          DROP DATABASE IF EXISTS flight_vis_owner_test;
          DROP ROLE IF EXISTS flightvis;
          CREATE ROLE flightvis LOGIN NOSUPERUSER PASSWORD 'flightvis_ci_test';
          CREATE DATABASE flight_vis_owner_test OWNER flightvis;
          SQL
          DATABASE_URL=postgres://flightvis:flightvis_ci_test@localhost:5432/flight_vis_owner_test \
            cargo test --manifest-path server-rs/Cargo.toml club::database::tests::flightvis_owner_migrations -- --exact --nocapture

      - name: cargo fmt
        run: cargo fmt --manifest-path server-rs/Cargo.toml -- --check

      - name: cargo test
        run: cargo test --manifest-path server-rs/Cargo.toml

      - name: cargo clippy
        run: cargo clippy --manifest-path server-rs/Cargo.toml --all-targets -- -D warnings

      - name: frontend
        run: npm ci && npm run build

      - name: dist has no inline scripts
        run: node scripts/check-dist-inline.mjs

      - name: bundle has no external QR hosts
        run: |
          if rg -q 'qrserver\\.com' dist/; then
            echo "dist/ must not reference external QR image hosts"
            rg 'qrserver\\.com' dist/
            exit 1
          fi

      - name: frontend lint
        run: npm run lint

      - name: no Argentine voseo in Spanish UI
        run: node scripts/voseo-check.mjs

      - name: globe CSP has single img-src directive
        run: node scripts/check-globe-csp.mjs

      - name: playwright e2e
        run: npx playwright install --with-deps && npm run test:e2e

      - name: docker build amd64
        run: docker build -t flight_vis:ci-amd64 .

      - name: docker image i18n catalogs (amd64)
        run: docker run --rm flight_vis:ci-amd64 /app/flight_vis check-i18n

  docker-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: docker build arm64
        run: docker buildx build --platform linux/arm64 -t flight_vis:ci-arm64 --load .

      - name: docker image i18n catalogs (arm64)
        run: docker run --rm flight_vis:ci-arm64 /app/flight_vis check-i18n
