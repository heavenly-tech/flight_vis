name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: flight_vis_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/flight_vis_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rust
        uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: clippy, rustfmt

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: cargo fmt
        run: cargo fmt --manifest-path server-rs/Cargo.toml -- --check

      - name: cargo test
        run: cargo test --manifest-path server-rs/Cargo.toml

      - name: cargo clippy
        run: cargo clippy --manifest-path server-rs/Cargo.toml --all-targets -- -D warnings

      - name: frontend
        run: npm ci && npm run build

      - name: bundle has no external QR hosts
        run: |
          if rg -q 'qrserver\\.com' dist/; then
            echo "dist/ must not reference external QR image hosts"
            rg 'qrserver\\.com' dist/
            exit 1
          fi

      - name: frontend lint
        run: npm run lint

      - name: playwright e2e
        run: npx playwright install --with-deps && npm run test:e2e

      - name: docker build
        run: docker build .
