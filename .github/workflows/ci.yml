name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: [self-hosted, Linux, X64, omarchibald, rust-builder-x64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rust
        uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: clippy

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: ffmpeg
        run: command -v ffmpeg || (sudo -n apt-get update && sudo -n apt-get install -y ffmpeg)

      - name: cargo test
        run: cargo test --manifest-path server-rs/Cargo.toml

      - name: cargo clippy
        run: cargo clippy --manifest-path server-rs/Cargo.toml --all-targets -- -D warnings

      - name: frontend
        run: npm ci && npm run build

      - name: docker build
        run: docker build .
