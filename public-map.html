<!doctype html>
<html lang="es-CL">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title data-i18n="club.publicMap.title">flight_vis</title>
    <link rel="stylesheet" href="/src/style.css" />
    <style>main{padding:1rem} li{padding:.35rem 0;border-bottom:1px solid rgba(255,255,255,.08)} #lang-slot{font-size:.9rem} .public-map-toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:.75rem;margin-bottom:.5rem}</style>
  </head>
  <body>
    <main>
      <div class="public-map-toolbar">
        <div id="lang-slot"></div>
        <a class="chip" href="/club-login.html" data-i18n="nav.clubLogin">Iniciar sesión del club</a>
      </div>
      <h1 data-i18n="club.publicMap.title"></h1>
      <p class="muted" data-i18n="club.publicMap.subtitle"></p>
      <ul id="list"></ul>
      <p><a href="/club-map.html" data-i18n="club.publicMap.membersLink"></a> · <a href="/" data-i18n="common.home"></a></p>
    </main>
    <script type="module">
      import { startClubPage } from "/src/club/i18nPage.ts";
      await startClubPage({ persistUser: false });
      const list = document.getElementById("list");
      const club = new URLSearchParams(location.search).get("club");
      const mapUrl = club
        ? `/api/club/map/public?club=${encodeURIComponent(club)}`
        : "/api/club/map/public";
      const res = await fetch(mapUrl);
      const data = await res.json();
      for (const row of data.aircraft ?? []) {
        const li = document.createElement("li");
        const name = row.pilotName ? ` · ${row.pilotName}` : "";
        li.textContent = `${row.tail}${name}`;
        list.appendChild(li);
      }
    </script>
  </body>
</html>
