services:
  flight_vis:
    build: .
    image: app-heavenly-flight-vis:latest
    container_name: app-heavenly-flight-vis
    restart: unless-stopped
    environment:
      PORT: 8080
      FLIGHT_DATA: /data
      FLIGHT_VIS_PASSWORD: ${FLIGHT_VIS_PASSWORD:-}
      VIRTUAL_HOST: flight.heavenly.cl
      LETSENCRYPT_HOST: flight.heavenly.cl
      VIRTUAL_PORT: 8080
    volumes:
      - ./data:/data
    networks:
      - proxy_network
      - default

networks:
  proxy_network:
    external: true
  default:
