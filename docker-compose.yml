services:
  flight_vis:
    build: .
    image: app-heavenly-flight-vis:latest
    container_name: app-heavenly-flight-vis
    restart: unless-stopped
    extra_hosts:
      - "postal-smtp:host-gateway"
    environment:
      PORT: 8080
      FLIGHT_DATA: /data
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      FLIGHT_VIS_PASSWORD: ${FLIGHT_VIS_PASSWORD:-}
      FLIGHT_CLUB_PUBLIC_URL: ${FLIGHT_CLUB_PUBLIC_URL:-https://flight.heavenly.cl}
      SMTP_HOST: ${SMTP_HOST:-postal-smtp}
      SMTP_PORT: ${SMTP_PORT:-25}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-noreply@heavenly.cl}
      POSTAL_WEBHOOK_PUBLIC_KEY_FILE: ${POSTAL_WEBHOOK_PUBLIC_KEY_FILE:-/run/secrets/postal-webhook-pub.pem}
      VIRTUAL_HOST: flight.heavenly.cl
      LETSENCRYPT_HOST: flight.heavenly.cl
      VIRTUAL_PORT: 8080
    volumes:
      - ./data:/data
    networks:
      - proxy_network
      - db_shared

networks:
  proxy_network:
    external: true
  db_shared:
    external: true