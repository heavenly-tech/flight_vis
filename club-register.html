<!doctype html>
<html lang="es-CL">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title data-i18n="club.register.title">flight_vis</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body class="fv-auth-page">
    <main class="auth-card">
      <div id="lang-slot" class="lang-bar"></div>
      <h1 id="club-title" data-i18n="club.register.title"></h1>
      <p id="club-pick-wrap" class="field" hidden>
        <label for="club-pick" data-i18n="club.register.pickClubLabel"></label>
        <select id="club-pick" hidden></select>
      </p>
      <form id="form" method="post" action="/api/club/register">
        <div class="field">
          <label for="reg-name" data-i18n="club.register.name"></label>
          <input id="reg-name" name="name" required autocomplete="name" data-i18n-placeholder="club.register.name" />
        </div>
        <div class="field">
          <label for="reg-email" data-i18n="club.register.email"></label>
          <input id="reg-email" name="email" type="email" required autocomplete="email" data-i18n-placeholder="club.register.email" />
        </div>
        <div class="field">
          <label for="reg-license" data-i18n="club.register.license"></label>
          <input id="reg-license" name="license_no" autocomplete="off" data-i18n-placeholder="club.register.license" />
        </div>
        <div class="field">
          <label for="reg-password" data-i18n="club.register.password"></label>
          <input id="reg-password" name="password" type="password" minlength="8" required autocomplete="new-password" data-i18n-placeholder="club.register.password" />
        </div>
        <button type="submit" class="btn-primary" data-i18n="club.register.submit"></button>
      </form>
      <p id="msg" class="status-msg" role="status" aria-live="polite"></p>
      <p class="muted"><a href="/login" data-i18n="nav.login"></a></p>
    </main>
    <script type="module" src="/src/club/clubRegister.ts"></script>
  </body>
</html>
