<!doctype html>
<html lang="es-CL">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title data-i18n="club.register.title">flight_vis</title>
    <link rel="stylesheet" href="/src/style.css" />
    <style>main{max-width:24rem;margin:2rem auto;padding:1rem} input,button,select{width:100%;padding:.6rem;margin:.35rem 0;font:inherit} #lang-slot{margin-bottom:.75rem;font-size:.9rem}</style>
  </head>
  <body>
    <main>
      <div id="lang-slot"></div>
      <h1 id="club-title" data-i18n="club.register.title"></h1>
      <p id="club-pick-wrap" hidden>
        <label for="club-pick" data-i18n="club.register.pickClubLabel"></label>
        <select id="club-pick" hidden></select>
      </p>
      <form id="form" method="post" action="/api/club/register">
        <input name="name" required data-i18n-placeholder="club.register.name" />
        <input name="email" type="email" required data-i18n-placeholder="club.register.email" />
        <input name="license_no" data-i18n-placeholder="club.register.license" />
        <input name="password" type="password" minlength="8" required data-i18n-placeholder="club.register.password" />
        <button type="submit" data-i18n="club.register.submit"></button>
      </form>
      <p id="msg" class="muted"></p>
      <p class="muted"><a href="/club-signup.html" data-i18n="nav.createClub"></a> · <a href="/login" data-i18n="nav.login"></a></p>
    </main>
    <script type="module" src="/src/club/clubRegister.ts"></script>
  </body>
</html>
