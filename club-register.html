<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Club register</title>
    <link rel="stylesheet" href="/src/style.css" />
    <style>main{max-width:24rem;margin:2rem auto;padding:1rem} input,button{width:100%;padding:.6rem;margin:.35rem 0;font:inherit}</style>
  </head>
  <body>
    <main>
      <h1>Register</h1>
      <form id="form">
        <input name="name" required placeholder="Name" />
        <input name="email" type="email" required placeholder="Email" />
        <input name="license_no" placeholder="Licence no." />
        <input name="password" type="password" minlength="8" required placeholder="Password" />
        <button type="submit">Register (pending approval)</button>
      </form>
      <p id="msg" class="muted"></p>
    </main>
    <script type="module">
      document.getElementById("form").addEventListener("submit", async (e) => {
        e.preventDefault();
        const body = Object.fromEntries(new FormData(e.target));
        const res = await fetch("/api/club/register", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body),
        });
        document.getElementById("msg").textContent = res.ok
          ? "Registered — wait for admin approval."
          : "Registration failed.";
      });
    </script>
  </body>
</html>
