<!doctype html>
<html lang="es-CL">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title data-i18n="pilot.title">flight_vis</title>
    <link rel="stylesheet" href="/src/style.css" />
    <style>
      .row {
        display: flex;
        gap: 0.5rem;
        flex-wrap: wrap;
        align-items: flex-end;
      }
      .row .field {
        flex: 1 1 14rem;
        margin: 0;
      }
      .token-box {
        word-break: break-all;
        font-family: monospace;
        font-size: 0.85rem;
        padding: 0.6rem;
        background: #0b0f16;
        border-radius: 8px;
        margin: 0.5rem 0;
      }
      #qr {
        max-width: 180px;
        background: #fff;
        padding: 8px;
        border-radius: 8px;
        margin-top: 0.75rem;
      }
      .section-heading {
        margin: 0 0 0.45rem;
        font-size: 1rem;
      }
    </style>
  </head>
  <body class="fv-page">
    <main class="admin-shell">
      <div id="lang-slot" class="lang-bar"></div>
      <h1 data-i18n="pilot.title"></h1>
      <p id="who" class="muted" role="status" aria-live="polite" data-i18n="pilot.checking"></p>
      <p id="profile" class="muted"></p>
      <button type="button" id="btn-logout" class="btn-secondary" data-i18n="pilot.logOut"></button>
      <p><a href="/app.html" data-i18n="pilot.downloadApp"></a></p>
      <section>
        <h2 class="section-heading" data-i18n="pilot.deviceToken"></h2>
        <p class="muted" data-i18n="pilot.deviceTokenHelp"></p>
        <div class="row">
          <div class="field">
            <label for="dev-label" data-i18n="pilot.phoneLabel"></label>
            <input id="dev-label" data-i18n-placeholder="pilot.phoneLabel" />
          </div>
          <button type="button" id="btn-new-device" class="btn-primary" data-i18n="pilot.createDevice"></button>
        </div>
        <div id="token-reveal" hidden>
          <img
            id="qr"
            alt="Código QR de vinculación del dispositivo"
            data-i18n-alt="pilot.deviceQrAlt"
            width="180"
            height="180"
          />
        </div>
        <ul id="devices"></ul>
      </section>
      <section>
        <h2 class="section-heading" data-i18n="pilot.myFlights"></h2>
        <ul id="flights"></ul>
      </section>
      <p><a href="/club-map.html" data-i18n="nav.clubMap"></a> · <a href="/" data-i18n="nav.globe"></a></p>
    </main>
    <script type="module" src="/src/club/pilot.ts"></script>
  </body>
</html>
