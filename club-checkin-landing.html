<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Check-in · flight_vis</title>
    <link rel="stylesheet" href="/src/style.css" />
    <style>
      main { max-width: 40rem; margin: 1rem auto; padding: 0 1rem 2rem; }
      .card { border: 1px solid rgba(255,255,255,.12); border-radius: 12px; padding: 1rem; margin: 1rem 0; }
      #map-list { list-style: none; padding: 0; margin: .5rem 0 0; }
      #map-list li { padding: .35rem 0; border-bottom: 1px solid rgba(255,255,255,.08); }
    </style>
  </head>
  <body>
    <main>
      <h1>Check-in del club</h1>
      <p class="muted">Abrí la app o instalala para completar el check-in. Este enlace no consume el QR.</p>
      <section class="card">
        <p><a id="btn-download" href="/app.html">Descarga la app</a> (instrucciones de instalación).</p>
        <p><a id="btn-intent" class="chip" href="#">Abrir la app</a></p>
      </section>
      <section class="card">
        <h2 style="font-size:1rem;margin:0 0 .5rem">Mapa en vivo (público)</h2>
        <ul id="map-list"></ul>
      </section>
    </main>
    <script type="module" src="/src/club/clubCheckinLanding.ts"></script>
  </body>
</html>
