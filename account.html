<!doctype html>
<html lang="es-CL">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title data-i18n="account.password.title">flight_vis</title>
    <link rel="stylesheet" href="/src/style.css" />
    <style>
      #current-wrap[hidden] {
        display: none !important;
      }
    </style>
  </head>
  <body class="fv-auth-page">
    <main class="auth-card">
      <div id="lang-slot" class="lang-bar"></div>
      <h1 data-i18n="account.password.title">Cuenta</h1>
      <p id="email-line" class="muted"></p>
      <form id="password-form">
        <div id="current-wrap" class="field">
          <label id="current-label" for="current" data-i18n="account.password.current"
            >Contraseña actual</label
          >
          <input id="current" name="current_password" type="password" autocomplete="current-password" />
        </div>
        <div class="field">
          <label for="new-password" data-i18n="account.password.new">Nueva contraseña</label>
          <input
            id="new-password"
            name="password"
            type="password"
            autocomplete="new-password"
            required
            minlength="8"
          />
        </div>
        <button type="submit" class="btn-primary" data-i18n="account.password.submit">Guardar contraseña</button>
        <p id="msg" class="status-msg" role="status" aria-live="polite"></p>
      </form>
      <p class="muted"><a href="/account-clubs.html" data-i18n="club.login.misClubs">Mis clubes</a></p>
    </main>
    <script type="module" src="/src/entrar/accountPage.ts"></script>
  </body>
</html>
