<!doctype html>
<html lang="es-CL">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Inicia sesión en flight_vis con correo y contraseña o enlace mágico." />
    <title data-i18n="club.login.title">flight_vis</title>
    <link rel="stylesheet" href="/src/style.css" />
    <style>
      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0;
        padding: 1rem;
      }
      main {
        width: min(400px, 100%);
        padding: 1.25rem;
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 16px;
        background: #10151d;
      }
      h1 {
        margin: 0 0 0.35rem;
        font-size: 1.1rem;
      }
      .lead {
        color: var(--muted, #9aa6b5);
        margin: 0 0 1rem;
        font-size: 0.95rem;
      }
      input,
      button {
        width: 100%;
        padding: 0.65rem;
        margin: 0.35rem 0;
        font: inherit;
        box-sizing: border-box;
      }
      .row-links {
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
        margin-top: 1rem;
      }
      .row-links a {
        text-align: center;
        padding: 0.65rem;
        border-radius: 10px;
        text-decoration: none;
        font-weight: 600;
      }
      .row-links .primary {
        background: #ecebff;
        color: #15132a;
      }
      .row-links .secondary {
        border: 1px solid rgba(255, 255, 255, 0.18);
        color: #67e8f9;
      }
      .msg {
        color: #f87171;
        min-height: 1.2em;
        font-size: 0.9rem;
      }
      .magic {
        background: transparent;
        border: 1px solid rgba(255, 255, 255, 0.18);
        color: #67e8f9;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <div id="lang-slot"></div>
      <h1 data-i18n="club.login.title"></h1>
      <p class="lead" data-i18n="entrar.unifiedLead"></p>
      <form id="login-form">
        <label for="email" data-i18n="club.login.email"></label>
        <input id="email" name="email" type="email" autocomplete="username" required />
        <label for="password" data-i18n="club.login.password"></label>
        <input id="password" name="password" type="password" autocomplete="current-password" />
        <input type="hidden" name="next" id="next" value="/" />
        <button type="submit" data-i18n="club.login.submit"></button>
        <button type="button" id="magic-btn" class="magic" data-i18n="club.login.sendMagic"></button>
        <p class="msg" id="msg"></p>
      </form>
      <div class="row-links">
        <a class="primary" href="/club-signup.html" data-i18n="nav.createClub"></a>
        <a class="secondary" href="/signup.html" data-i18n="account.signup.link"></a>
      </div>
    </main>
    <script type="module" src="/src/entrar/loginPage.ts"></script>
  </body>
</html>
