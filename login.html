<!doctype html>
<html lang="es-CL">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Inicia sesión en flight_vis con enlace mágico o contraseña." />
    <meta name="theme-color" content="#152B52" />
    <title data-i18n="club.login.title">flight_vis</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="stylesheet" href="/src/style.css" />
    <style>
      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0;
        padding: 1rem;
      }
      main {
        width: min(400px, 100%);
        padding: 1.25rem;
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 16px;
        background: #10151d;
      }
      h1 {
        margin: 0 0 0.35rem;
        font-size: 1.1rem;
      }
      .lead {
        color: var(--muted, #9aa6b5);
        margin: 0 0 1rem;
        font-size: 0.95rem;
      }
      input,
      button {
        width: 100%;
        padding: 0.65rem;
        margin: 0.35rem 0;
        font: inherit;
        box-sizing: border-box;
      }
      .row-links {
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
        margin-top: 1.25rem;
      }
      .row-links a {
        text-align: center;
        padding: 0.65rem;
        border-radius: 10px;
        text-decoration: none;
        font-weight: 600;
      }
      .row-links .secondary {
        border: 1px solid rgba(255, 255, 255, 0.18);
        color: #67e8f9;
      }
      .row-links .primary {
        background: #ecebff;
        color: #15132a;
      }
      .msg {
        color: #f87171;
        min-height: 1.2em;
        font-size: 0.9rem;
      }
      .muted-link {
        display: inline-block;
        margin-top: 0.75rem;
        font-size: 0.9rem;
        color: #67e8f9;
      }
      .primary-btn {
        background: #ecebff;
        color: #15132a;
        border: 0;
        border-radius: 10px;
        font-weight: 650;
        cursor: pointer;
      }
      details.muted {
        margin-top: 1rem;
        font-size: 0.9rem;
      }
    </style>
  </head>
  <body class="fv-auth-page">
    <main class="auth-card">
      <div id="lang-slot" class="lang-bar"></div>
      <h1 data-i18n="entrar.title">Iniciar sesión</h1>
      <p class="lead" data-i18n="entrar.magicLead">
        Ingresa tu correo y te enviaremos un enlace para iniciar sesión.
      </p>
      <form id="login-form" method="post" action="/api/account/magic-link">
        <label for="email" data-i18n="club.login.email">Correo</label>
        <input
          id="email"
          name="email"
          type="email"
          autocomplete="username"
          required
          placeholder="Correo"
        />
        <input type="hidden" name="next" id="next" value="/" />
        <div id="password-reveal" hidden>
          <label for="password" data-i18n="club.login.password">Contraseña</label>
          <input
            id="password"
            name="password"
            type="password"
            autocomplete="current-password"
            placeholder="Contraseña"
          />
        </div>
        <button type="submit" id="submit-magic" class="primary-btn" data-i18n="entrar.sendLink">
          Enviar enlace
        </button>
        <button type="submit" id="submit-password" class="primary-btn" hidden data-i18n="club.login.submit">
          Iniciar sesión
        </button>
        <a
          id="use-password"
          class="muted-link"
          href="/login?mode=password"
          data-i18n="entrar.usePassword"
        >
          Usar contraseña
        </a>
        <a class="muted-link" id="back-magic" href="/login" hidden data-i18n="entrar.backMagic">
          ← Usar enlace mágico
        </a>
        <p class="msg" id="form-msg" role="status" aria-live="polite"></p>
        <details id="legacy-details" class="muted" hidden>
          <summary data-i18n="club.login.legacyApk">
            App Android 1.0 (sesión directa del club)
          </summary>
          <button
            type="submit"
            formaction="/api/club/login"
            formmethod="post"
            id="legacy-submit"
            data-i18n="club.login.legacySubmit"
          >
            Ingresar (APK legacy)
          </button>
        </details>
      </form>
      <div class="row-links">
        <a
          id="register-pilot"
          class="secondary"
          href="/signup.html"
          data-i18n="entrar.registerPilot"
        >
          Registrar piloto
        </a>
        <a
          id="register-club"
          class="primary"
          href="/club-signup.html"
          data-i18n="nav.registerClub"
        >
          Registrar club
        </a>
      </div>
    </main>
    <script type="module" src="/src/entrar/loginPage.ts"></script>
  </body>
</html>
