<!doctype html>
<html lang="es-CL">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Elige cómo iniciar sesión en flight_vis." />
    <title data-i18n="entrar.title">flight_vis</title>
    <link rel="stylesheet" href="/src/style.css" />
    <style>
      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0;
        padding: 1rem;
      }
      main {
        width: min(400px, 100%);
        padding: 1.25rem;
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 16px;
        background: #10151d;
      }
      h1 {
        margin: 0 0 0.35rem;
        font-size: 1.1rem;
      }
      .lead {
        color: var(--muted, #9aa6b5);
        margin: 0 0 1.25rem;
        font-size: 0.95rem;
      }
      #lang-slot {
        margin-bottom: 0.75rem;
        font-size: 0.9rem;
      }
      .path-btn {
        display: block;
        width: 100%;
        text-align: center;
        text-decoration: none;
        margin: 0.5rem 0;
        padding: 0.85rem 1rem;
        border-radius: 10px;
        font: 600 0.95rem inherit;
        border: 1px solid rgba(255, 255, 255, 0.18);
        background: #ecebff;
        color: #15132a;
      }
      .path-btn.secondary {
        background: transparent;
        color: #67e8f9;
      }
      .path-btn.secondary:hover {
        border-color: rgba(103, 232, 249, 0.45);
      }
    </style>
  </head>
  <body>
    <main>
      <div id="lang-slot"></div>
      <h1 data-i18n="entrar.title"></h1>
      <p class="lead" data-i18n="entrar.lead"></p>
      <a id="btn-club" class="path-btn" href="/club-login.html" data-i18n="entrar.club"></a>
      <a id="btn-pilot" class="path-btn secondary" href="/club-login.html" data-i18n="entrar.pilot"></a>
    </main>
    <script type="module">
      import { bootLoginChooser } from "/src/entrar/loginChooser.ts";
      bootLoginChooser();
    </script>
  </body>
</html>
