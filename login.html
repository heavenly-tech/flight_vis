<!doctype html>
<html lang="es-CL">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Inicia sesión en flight_vis con enlace mágico o contraseña." />
    <title data-i18n="club.login.title">flight_vis</title>
    <link rel="stylesheet" href="/src/style.css" />
    <style>
      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0;
        padding: 1rem;
      }
      main {
        width: min(400px, 100%);
        padding: 1.25rem;
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 16px;
        background: #10151d;
      }
      h1 {
        margin: 0 0 0.35rem;
        font-size: 1.1rem;
      }
      .lead {
        color: var(--muted, #9aa6b5);
        margin: 0 0 1rem;
        font-size: 0.95rem;
      }
      input,
      button {
        width: 100%;
        padding: 0.65rem;
        margin: 0.35rem 0;
        font: inherit;
        box-sizing: border-box;
      }
      .row-links {
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
        margin-top: 1.25rem;
      }
      .row-links a {
        text-align: center;
        padding: 0.65rem;
        border-radius: 10px;
        text-decoration: none;
        font-weight: 600;
      }
      .row-links .primary {
        background: #ecebff;
        color: #15132a;
      }
      .row-links .secondary {
        border: 1px solid rgba(255, 255, 255, 0.18);
        color: #67e8f9;
      }
      .msg {
        color: #f87171;
        min-height: 1.2em;
        font-size: 0.9rem;
      }
      .muted-link {
        display: inline-block;
        margin-top: 0.75rem;
        font-size: 0.9rem;
        color: #67e8f9;
      }
      .primary-btn {
        background: #ecebff;
        color: #15132a;
        border: 0;
        border-radius: 10px;
        font-weight: 650;
        cursor: pointer;
      }
      details.muted {
        margin-top: 1rem;
        font-size: 0.9rem;
      }
    </style>
  </head>
  <body>
    <main>
      <div id="lang-slot"></div>
      <h1 data-i18n="club.login.title"></h1>
      <p class="lead" data-i18n="entrar.magicLead"></p>
      <section id="magic-panel">
        <label for="email-magic" data-i18n="club.login.email"></label>
        <input id="email-magic" name="email" type="email" autocomplete="username" required />
        <button type="button" id="magic-btn" class="primary-btn" data-i18n="entrar.sendLink"></button>
        <a id="use-password" class="muted-link" href="/login?mode=password" data-i18n="entrar.usePassword"></a>
        <p class="msg" id="magic-msg"></p>
      </section>
      <section id="password-panel" hidden>
        <p class="lead" data-i18n="entrar.passwordLead"></p>
        <form id="password-form" method="post" action="/api/account/login">
          <input name="email" type="email" autocomplete="username" required data-i18n-placeholder="club.login.email" />
          <input name="password" type="password" autocomplete="current-password" required data-i18n-placeholder="club.login.password" />
          <input type="hidden" name="next" id="next" value="/" />
          <button type="submit" class="primary-btn" data-i18n="club.login.submit"></button>
        </form>
        <p class="msg" id="password-msg"></p>
        <details class="muted">
          <summary data-i18n="club.login.legacyApk"></summary>
          <form id="legacy-club-form" method="post" action="/api/club/login">
            <input type="hidden" name="next" id="legacy-next" value="/club-pilot.html" />
            <input name="email" type="email" required autocomplete="username" data-i18n-placeholder="club.login.email" />
            <input name="password" type="password" required minlength="8" autocomplete="current-password" data-i18n-placeholder="club.login.password" />
            <button type="submit" data-i18n="club.login.legacySubmit"></button>
          </form>
        </details>
        <a class="muted-link" id="back-magic" href="/login" data-i18n="entrar.backMagic"></a>
      </section>
      <div class="row-links">
        <a class="secondary" href="/signup.html" data-i18n="entrar.createAccount"></a>
        <a class="primary" href="/club-signup.html" data-i18n="nav.registerClub"></a>
      </div>
    </main>
    <script type="module" src="/src/entrar/loginPage.ts"></script>
  </body>
</html>
