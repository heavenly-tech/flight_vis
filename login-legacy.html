<!doctype html>
<html lang="es-CL">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Legacy disk library password login (superadmin)." />
    <title data-i18n="legacyLogin.title">flight_vis</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body class="fv-auth-page">
    <main class="auth-card">
      <h1 data-i18n="legacyLogin.title"></h1>
      <p class="muted" data-i18n="legacyLogin.lead"></p>
      <div id="gate-denied" hidden>
        <p class="muted" data-i18n="legacyLogin.denied"></p>
        <p><a href="/login" data-i18n="entrar.back"></a></p>
      </div>
      <form id="legacy-form" method="post" action="/login" hidden>
        <div class="field">
          <label for="password" data-i18n="legacyLogin.password"></label>
          <input id="password" name="password" type="password" required autocomplete="current-password" />
        </div>
        <input type="hidden" name="next" id="next" value="/" />
        <button type="submit" class="btn-primary" data-i18n="legacyLogin.submit"></button>
        <p class="error-msg" id="err" role="alert"></p>
      </form>
      <p id="locked" class="muted" role="status" aria-live="polite" hidden data-i18n="legacyLogin.locked"></p>
    </main>
    <script type="module" src="/src/entrar/loginLegacyPage.ts"></script>
  </body>
</html>
